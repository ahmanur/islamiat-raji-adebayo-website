kind = "web"
previewPath = "/"
title = "Dr. Islamiat Raji-Adebayo"
version = "1.0.0"
id = "artifacts/iar-site"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25998

[services.development]
run = "pnpm --filter @workspace/iar-site run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/iar-site", "run", "build" ]
publicDir = "artifacts/iar-site/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25998"
BASE_PATH = "/"
